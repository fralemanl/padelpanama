<!doctype html>
<html lang="en-US">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Ranking - APP</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic"
      type="text/css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Open Sans", sans-serif;
        background: #f9f9f9;
      }

      .top_panel {
        background: #2d2d2d;
        color: white;
        padding: 15px 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .top_panel_top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
      }

      .contact-info {
        display: flex;
        gap: 30px;
        font-size: 13px;
      }

      .contact-info span {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .user-links {
        display: flex;
        gap: 20px;
        font-size: 13px;
      }

      .user-links a {
        color: white;
        text-decoration: none;
        transition: color 0.3s;
      }

      .user-links a:hover {
        color: #003d99;
      }

      .header {
        background: white;
        padding: 20px 0;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 28px;
        font-weight: bold;
        color: #2d2d2d;
      }

      .logo .icon {
        color: #003d99;
        margin-right: 10px;
      }

      .menu {
        display: flex;
        gap: 30px;
        list-style: none;
      }

      .menu a {
        color: #666;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
        font-size: 14px;
      }

      .menu a:hover,
      .menu a.active {
        color: #003d99;
      }

      .ranking-wrapper {
        max-width: 1920px;
        margin: 40px auto;
        padding: 0 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      .ranking-header {
        background: linear-gradient(135deg, #003d99 0%, #388e3c 100%);
        color: white;
        padding: 40px 20px;
        text-align: center;
      }

      .ranking-header h1 {
        font-size: 36px;
        margin-bottom: 10px;
      }

      .ranking-header p {
        font-size: 16px;
        opacity: 0.9;
      }

      .ranking-container {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        margin: 0;
      }

      .ranking-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }

      .footer {
        background: #2d2d2d;
        color: white;
        text-align: center;
        padding: 40px 20px;
        margin-top: 60px;
      }

      .footer p {
        font-size: 14px;
        opacity: 0.8;
      }

      @media (max-width: 768px) {
        .top_panel_top {
          flex-direction: column;
          gap: 15px;
        }

        .contact-info {
          flex-direction: column;
          gap: 10px;
        }

        .menu {
          gap: 15px;
        }

        .ranking-header h1 {
          font-size: 24px;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      type="text/css"
      media="all"
    />
  </head>
  <body>
    <!-- Top Panel -->
    <div class="top_panel">
      <div class="container">
        <div class="top_panel_top">
          <div class="contact-info">
            <span>?? +(507) 6674-1441</span>
            <span>?? info@padelpanama.org</span>
          </div>
          <div class="user-links">
            <a href="index.html">Home</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Header -->
    <!-- Ranking Section -->
    <div class="ranking-wrapper">
      <div class="ranking-container">
        <iframe
          src="https://ranking-elo-six.vercel.app/"
          title="APP Panama Rankings"
        ></iframe>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>
        &copy; 2026 APP. All rights reserved. | Rankings updated weekly |
        Developed by
        <a
          href="https://wa.me/50767885188?text=Hemos%20visto%20la%20pagina%20web%20que%20has%20desarrollado%20y%20nos%20gustaria%20contactar%20contigo."
          target="_blank"
          rel="noopener noreferrer"
        >
          RankingX
        </a>
        | Sports Ranking Modelist
      </p>
    </div>
  </body>
</html>
